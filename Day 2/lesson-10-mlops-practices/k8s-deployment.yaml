apiVersion: apps/v1
kind: Deployment
metadata:
  name: income-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: income-flask-app
  template:
    metadata:
      labels:
        app: income-flask-app
    spec:
      containers:
        - name: income-predictor
          image: income-flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

    
---
apiVersion: v1
kind: Service
metadata:
  name: income-flask-service
spec:
  selector:
    app: income-flask-app
  ports:
    - protocol: TCP
      port: 8000
      nodePort: 30800
  type: NodePort
